<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Radar Cidadão - Plano Cartesiano</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .info {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .form-section {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            border-left: 4px solid #007bff;
        }

        .form-section h2,
        .canvas-section h2 {
            font-size: 16px;
            margin-bottom: 15px;
            color: #333;
        }

        .form-row {
            border: none;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            font-size: 14px;
            color: #333;
        }

        input {
            display: block;
            width: 100%;
            margin-top: 5px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.3);
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
            transition: background 0.3s;
        }

        button:hover {
            background: #0056b3;
        }

        button + button {
            margin-top: 10px;
            background: #4CAF50;
        }

        .status {
            display: block;
            background: #e7f3ff;
            border: 1px solid #b3d9ff;
            border-radius: 4px;
            padding: 15px;
            margin-top: 15px;
            font-size: 14px;
            color: #004085;
        }

        .status.manual {
            background: #fff3cd;
            border-color: #ffc107;
            color: #856404;
        }

        .status.gps {
            background: #d4edda;
            border-color: #4caf50;
            color: #155724;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            border: 2px solid #ddd;
            border-radius: 4px;
            background: white;
        }

        .legend {
            list-style: none;
            margin-top: 15px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            font-size: 13px;
        }

        .legend li {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .dot-you {
            background: #4CAF50;
            border: 2px solid white;
            box-shadow: 0 0 8px rgba(76, 175, 80, 0.5);
        }

        .dot-water  { background: #00a8e1; }
        .dot-trash  { background: #ff9800; }
        .dot-urgent { background: #ff4444; }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .legend {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Plano Cartesiano - Radar Cidadão</h1>
        <p class="info">Visualize sua localização e os alertas em um plano com coordenadas reais</p>

        <section class="form-section">
            <h2>Definir Localização</h2>

            <form id="locationForm">
                <fieldset class="form-row">
                    <label>Latitude
                        <input type="number" id="latitude" placeholder="-23.5505" step="any" min="-90" max="90">
                    </label>
                    <label>Longitude
                        <input type="number" id="longitude" placeholder="-46.6333" step="any" min="-180" max="180">
                    </label>
                </fieldset>
                <button type="submit">Salvar Localização</button>
                <button type="button" id="btnGps">Detectar Localização</button>
            </form>

            <output id="locationStatus" class="status">Aguardando localização...</output>
        </section>

        <section class="canvas-section">
            <h2>Mapa de Alertas</h2>
            <p id="alertCount" class="info">Carregando alertas...</p>

            <canvas id="mapCanvas"></canvas>

            <ul class="legend">
                <li><span class="legend-dot dot-you"></span> Você</li>
                <li><span class="legend-dot dot-water"></span> Alagamento</li>
                <li><span class="legend-dot dot-trash"></span> Lixo</li>
                <li><span class="legend-dot dot-urgent"></span> Urgente</li>
            </ul>
        </section>
    </main>

    <script src="./storage.js"></script>
    <script src="./geo.js"></script>
    <script src="./cartesiano.js"></script>
    <script src="./mapa.js"></script>
</body>
</html>
