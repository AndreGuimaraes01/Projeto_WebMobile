<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Radar Cidadão - Feed da Região</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <main id="app-container">
        
        <header>
            <h1>Alertas na Região</h1>
        </header>

        <section class="view">
            <!-- Trocamos a div por um header interno da seção -->
            <header class="feed-header">
                <p style="margin: 0;">Problemas num raio de 2km de você</p>
            </header>
            
            <!-- Trocamos a div por uma <ul> (Unordered List) -->
            <ul id="alert-list">
                
                <!-- Trocamos o card por uma <li> (List Item) -->
                <li class="alert-card">
                    <!-- Trocamos a div do ícone por um <span> -->
                    <span class="alert-icon">💧</span>
                    
                    <!-- Trocamos a div de info por um <article> -->
                    <article class="alert-info">
                        <h4>Via Alagada</h4>
                        <p>A 350m de você</p>
                    </article>
                </li>
                
            </ul>
        </section>

        <nav id="bottom-nav">
            <a href="index.html" class="nav-item">📍 Reportar</a>
            <a href="feed.html" class="nav-item active">📋 Ver Bairro</a>
        </nav>

    </main>

    <script src="./js/storage.js"></script>
</body>
</html>
