<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Radar Cidadão - Reportar</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main id="app-container">

        <header>
            <h1>Radar Cidadão</h1>
        </header>

        <section class="view">
            <aside class="status-card" id="statusCard">
                <p class="status-title">Aguardando localização...</p>
                <p class="status-subtitle">Configure em "Plano"</p>
            </aside>

            <menu class="action-buttons">
                <button id="btn-water" class="btn btn-primary" type="button">Reportar Alagamento</button>
                <button id="btn-trash" class="btn btn-secondary" type="button">Acúmulo de Lixo</button>
            </menu>

            <form id="report-form" class="report-form" hidden>
                <fieldset>
                    <legend id="form-title">Detalhes do Alerta</legend>

                    <input type="hidden" id="alert-type" value="">

                    <label for="descricao">Descrição</label>
                    <textarea
                        id="descricao"
                        name="descricao"
                        rows="3"
                        placeholder="Ex: água parada na esquina, altura da calçada..."
                        required
                    ></textarea>

                    <label for="gravidade">Gravidade</label>
                    <select id="gravidade" name="gravidade">
                        <option value="low">🟢 Leve</option>
                        <option value="moderate" selected>🟡 Moderado</option>
                        <option value="urgent">🔴 Grave</option>
                    </select>

                    <label for="foto">Foto (opcional)</label>
                    <input type="file" id="foto" name="foto" accept="image/*" capture="environment">

                    <menu class="action-buttons">
                        <button type="submit" class="btn btn-primary">Enviar Alerta</button>
                        <button type="button" id="btn-cancel" class="btn btn-secondary">Cancelar</button>
                    </menu>
                </fieldset>
            </form>

            <output id="report-status" class="report-status" for="report-form"></output>

            <article class="user-summary">
                <h4>Seus reports hoje</h4>
                <p id="userReportCount">Você ainda não enviou nenhum alerta.</p>
            </article>
        </section>

        <nav id="bottom-nav">
            <a href="index.html" class="nav-item active"></a> Reportar</a>
            <a href="feed.html" class="nav-item">Ver Bairro</a>
            <a href="mapa.html" class="nav-item">Plano</a>
            <a href="como-funciona.html" class="nav-item">Como Funciona</a>
        </nav>

    </main>

    <script src="./storage.js"></script>
    <script src="./geo.js"></script>
    <script src="./alerts-counter.js"></script>
    <script src="./reportar.js"></script>
</body>
</html>
